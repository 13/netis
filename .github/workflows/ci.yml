name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # The store's queries run on both backends, so the suite runs on both. The
    # SQLite tests need nothing; NETIS_TEST_PG_DSN switches on the Postgres half.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: netis
          POSTGRES_PASSWORD: netis
          POSTGRES_DB: netis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U netis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NETIS_TEST_PG_DSN: postgres://netis:netis@127.0.0.1:5432/netis?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: templ generate (fail on drift)
        run: |
          go tool templ generate
          git diff --exit-code -- '*_templ.go'

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

      - name: tests (race)
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" ./cmd/netis

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # Build only — catches a broken Dockerfile before a release tag is cut.
      # The same build args the release passes, so that path is exercised too.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
            BUILD=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
