name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # The store's queries run on both backends, so the suite runs on both. The
    # SQLite tests need nothing; NETIS_TEST_PG_DSN switches on the Postgres half.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: netis
          POSTGRES_PASSWORD: netis
          POSTGRES_DB: netis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U netis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NETIS_TEST_PG_DSN: postgres://netis:netis@127.0.0.1:5432/netis?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: templ generate (fail on drift)
        run: |
          go tool templ generate
          git diff --exit-code -- '*_templ.go'

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

      # shell: bash turns on pipefail, so a failing test still fails the step
      # through the tee.
      - name: tests (race, coverage)
        shell: bash
        run: go test -race -coverprofile=cover.out ./... | tee test-output.txt

      # Coverage goes to the job summary; nothing is uploaded anywhere. The
      # generated templ views are mostly markup that tests assert on as HTML
      # rather than cover line by line, so a second total leaves them out.
      - name: coverage summary
        if: always() && hashFiles('cover.out') != ''
        shell: bash
        run: |
          grep -v '_templ.go:' cover.out > cover.app.out
          {
            echo '### Coverage'
            echo
            echo '```'
            echo "total:                   $(go tool cover -func=cover.out | tail -1 | awk '{print $NF}')"
            echo "total (excluding templ): $(go tool cover -func=cover.app.out | tail -1 | awk '{print $NF}')"
            echo
            grep 'coverage:' test-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" ./cmd/netis

  # Visual regression and accessibility smoke tests (e2e/). The fixture server
  # is the web package's test binary (fixed data, frozen clock); Playwright
  # runs in its pinned image so rendering matches the committed baselines,
  # which `make e2e-update` generates in the same image.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build the fixture server
        run: CGO_ENABLED=0 go test -c -buildvcs=false -o e2e/.bin/netis-e2e ./internal/web

      - name: playwright (visual + a11y)
        run: |
          docker run --rm --ipc=host --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=1 \
            -v "$PWD/e2e":/e2e -w /e2e mcr.microsoft.com/playwright:v1.63.0-noble \
            sh -c 'npm ci --no-audit --no-fund && npx playwright test'

      # The HTML report holds the expected, actual and diff image of every
      # screenshot that changed.
      - name: upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only — catches a broken Dockerfile before a release tag is cut.
      # The same build args and platform the release passes, so that path is
      # exercised too.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
            BUILD=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
