name: Release

on:
  push:
    tags: ['v*']

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: now
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # only tags reach this workflow, so latest is unconditional
          flavor: latest=true

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD=${{ github.run_number }}
            DATE=${{ steps.now.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The README sells netis as a single static binary; until this job existed a
  # release shipped only a container image, so running it without Docker meant
  # building it yourself. The images are amd64 only, so the arm64 tarball is how
  # an arm64 machine runs a released build.
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go tool templ generate

      - id: now
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: build
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD: ${{ github.run_number }}
          DATE: ${{ steps.now.outputs.date }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w \
                -X netis/internal/buildinfo.Version=${version} \
                -X netis/internal/buildinfo.Commit=${COMMIT} \
                -X netis/internal/buildinfo.Build=${BUILD} \
                -X netis/internal/buildinfo.Date=${DATE}" \
              -o "dist/netis" ./cmd/netis
            tar -czf "dist/netis_${version}_linux_${arch}.tar.gz" -C dist netis -C .. LICENSE README.md
            rm dist/netis
          done
          cd dist && sha256sum ./*.tar.gz > SHA256SUMS

      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The tag may have been pushed without a release object; create one if
          # so, then upload. --clobber keeps a re-run of this workflow working.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" dist/* --clobber
